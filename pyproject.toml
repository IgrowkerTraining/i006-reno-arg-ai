[project]
name = "reno-studio-ai"
version = "1.0.0"
description = "API para análisis de obras de construcción con integración de OpenRouter AI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Axel Langerman", email = "langerman@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# --- Dependencias de Producción ---
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.1",
    "sqlalchemy>=2.0.27",
    "psycopg2-binary>=2.9.9",
    "openai>=1.13.3",          # Para usar OpenRouter con el SDK oficial
    "python-dotenv>=1.0.1",
    "pydantic[email]>=2.6.3",
    "pydantic-settings>=2.2.1",
    "httpx>=0.25.2",           # Necesario para llamadas asíncronas y testing
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",           # Fijado para evitar conflictos de compilación
    "email-validator>=2.1.0",
    "requests>=2.32.5",
]

# --- Dependencias de Desarrollo ---
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",             # Ruff maneja linting, isort y mejoras de código
]

[project.urls]
Homepage = "https://github.com/langermanaxel/my_ai_api"
Repository = "https://github.com/langermanaxel/my_ai_api"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --- Configuración de Herramientas ---

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py311"
# Ruff sustituye a isort, flake8 y autoflake
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]